# Build the app on every push to main and put it on the dev site,
# https://hunt-dev.groundwind.app (docs/DEPLOY.md). The live app,
# hunt.groundwind.app, moves only when the `live` branch does (pages.yml).
#
# The same build as app/scripts/deploy-dev.ps1: the data read from R2 (synced
# here from this commit, the manifests last), a DEV badge with the commit,
# no usage stats. Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) for
# the deploy, R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY for the data.
name: dev
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dev
  cancel-in-progress: true
jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
        working-directory: app
      - run: pip install boto3
      - name: build
        working-directory: app
        env:
          BASE_PATH: /
          VITE_DATA_BASE: https://data.groundwind.app/data/
          VITE_DEV_SITE: '1'
        run: npx tsc -b && npx vite build --outDir dist-dev --emptyOutDir
      - name: data to R2
        run: python app/scripts/r2_sync.py --manifests app/dist-dev/data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: deploy
        working-directory: app/dev-site
        run: npx --yes wrangler@4.151.0 deploy --message "main ${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
