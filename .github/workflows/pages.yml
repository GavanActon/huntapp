# Build the app and publish it to GitHub Pages on every push to main.
# The app lives at the root of its custom domain, hunt.groundwind.app
# (the repo's Pages setting), so BASE_PATH is /.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # After the deploy: purge Cloudflare's cache for hunt.groundwind.app and
  # fetch the cold-open files through it (app/scripts/warm-cache.sh), so the
  # first phone finds the bundle and the grids at the edge. Without the
  # CF_CACHE_TOKEN secret it warms without purging.
  warm:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sleep 20 && bash app/scripts/warm-cache.sh
        env:
          CF_CACHE_TOKEN: ${{ secrets.CF_CACHE_TOKEN }}
