# Build the app and publish it to GitHub Pages when the `live` branch moves:
# main goes to the dev site first (dev.yml), and a build checked there is
# promoted with `git push origin <sha>:live` (docs/DEPLOY.md). The repo's
# github-pages environment lets only `live` deploy.
# The app lives at the root of its custom domain, hunt.groundwind.app
# (the repo's Pages setting), so BASE_PATH is /.
name: pages
on:
  push:
    branches: [live]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # run by hand from main, it would put main live past the dev site
    if: github.ref == 'refs/heads/live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          BASE_PATH: /
          # Area data from R2 (docs/AREAS.md, Hosting; docs/DEPLOY.md), on since
          # 2026-10-17 (Gavan: "live needs to be everything on hunt dev"): the
          # live app reads the same data/ prefix the dev site reads, which
          # dev.yml syncs from every push of main and the bakes upload to by
          # hand, so live and hunt-dev always see the same areas, far band and
          # tiles. The bundle is the app alone: KEEP_DATA_IN_DIST ('1') kept
          # app/public/data in it for the one deploy after the switch
          # (b2e2bd9), so a phone still on the build before it found its own
          # data/ until it updated.
          VITE_DATA_BASE: https://data.groundwind.app/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # After the deploy: purge Cloudflare's cache for hunt.groundwind.app and
  # fetch the cold-open files through it (app/scripts/warm-cache.sh), so the
  # first phone finds the bundle and the grids at the edge. Without the
  # CF_CACHE_TOKEN secret it warms without purging.
  warm:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sleep 20 && bash app/scripts/warm-cache.sh
        env:
          CF_CACHE_TOKEN: ${{ secrets.CF_CACHE_TOKEN }}
          # with VITE_DATA_BASE above: the grids are warmed where the app reads them
          WARM_DATA: https://data.groundwind.app/data
