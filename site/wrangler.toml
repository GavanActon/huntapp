# groundwind.app: this folder served as static assets by a Worker.
# Deploy from site/ with `npx wrangler deploy`; the custom domains make
# their own DNS records and certificates (the zone is on Cloudflare).
name = "groundwind-site"
main = "worker.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "groundwind.app", custom_domain = true },
  { pattern = "www.groundwind.app", custom_domain = true },
]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
# the worker sees every request first, for www, /app and /api
run_worker_first = true

# hourly: the pages that changed since the last send go to IndexNow (indexnow.js)
[triggers]
crons = ["17 * * * *"]

# area requests (schema.sql); the id comes from `npx wrangler d1 create groundwind`
[[d1_databases]]
binding = "DB"
database_name = "groundwind"
database_id = "5801c0bf-cb98-4799-bc24-226bb96ec381"

# usage stats from the app (stats.js): a phone sends a batch every 30 s at
# most, so 30 a minute from one address is a loop or a flood, not a hunter
# Email (site/mail.js, docs/REQUESTS.md "Email"). NOTIFY: Email Routing's free sending, verified
# destination addresses only: Gavan's inbox, the OWNER_EMAIL secret (the repo is public).
[[send_email]]
name = "NOTIFY"

# MAIL: Email Sending to any address (Workers Paid, groundwind.app onboarded in Email Service);
# on once that is done:
# [[send_email]]
# name = "MAIL"
# allowed_sender_addresses = ["noreply@groundwind.app"]

[[ratelimits]]
name = "EVENTS_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
