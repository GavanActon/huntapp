# The app's dev site (docs/SD-FAST.md, "The dev site"): the built app only,
# no code, no bindings, no routes. Its address, hunt-dev.groundwind.app, is
# added by hand in the dashboard (the Worker's Domains). Deploy with
# app/scripts/deploy-dev.ps1, never by hand from site/: wrangler run there
# picks up the groundwind.app Worker's config (2026-10-13, it took the site's
# domains).
name = "groundwind-hunt-dev"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "../dist-dev"
not_found_handling = "single-page-application"
