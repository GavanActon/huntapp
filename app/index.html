<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groundwind" />
    <meta name="theme-color" content="#0a100b" />
    <!-- search finds the app through groundwind.app, not this address -->
    <meta name="robots" content="noindex" />
    <!-- the app needs a secure page (service worker, the party's sealing):
         a plain http visit to its own host goes to https -->
    <script>
      if (location.protocol === 'http:' && location.hostname.endsWith('groundwind.app')) location.replace('https://' + location.host + location.pathname + location.search + location.hash)
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://geo.weather.gc.ca" crossorigin />
    <title>Groundwind</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a100b; }
      #splash { position: fixed; inset: 0; background: #0a100b; color: #eef5ea; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.35s ease; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .word { text-align: center; }
      #splash .word b { display: block; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
      #splash .word span { display: block; margin-top: 4px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6f8a6a; }
    </style>
    <script>
      // the area this page opens on, picked as the app will pick it (areas/start.ts) but before
      // any of it loads: the one the link's spot is in, else the link's, else the phone's, else
      // an iPhone install's seed. On an iPhone, Add to Home Screen keeps the first manifest in
      // the head, and the icon starts at its start_url with storage of its own: another area's
      // manifest goes in here, ahead of the app's (vite.config.ts areaLinks fills the slot), and
      // the icon takes the area's name
      (function () {
        try {
          var S = /*AREAS*/{}
          var AREAS = S.areas || {}
          var known = function (id) { return id != null && Object.prototype.hasOwnProperty.call(AREAS, id) }
          var q = new URLSearchParams(location.search)
          var h = new URLSearchParams(location.hash.slice(1))
          // the spot, from the fragment or else the query, read as share/link.ts readAt reads it
          var at = h.get('at')
          if (at == null) at = q.get('at')
          var m = /^\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/.exec(at || '')
          var lat = m ? Number(m[1]) : NaN
          var lon = m ? Number(m[2]) : NaN
          var spotIn = null
          if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
            for (var k in AREAS) {
              var r = known(k) ? AREAS[k].region : null
              if (r && lon >= r.west && lon <= r.east && lat >= r.south && lat <= r.north) { spotIn = k; break }
            }
          }
          var asked = q.get('area')
          if (asked == null) asked = h.get('area')
          var saved = null
          try { saved = localStorage.getItem('huntapp-area') } catch (e) {}
          var id = spotIn || (known(asked) ? asked : known(saved) ? saved : known(q.get('start')) ? q.get('start') : null) || S.default
          var area = known(id) ? AREAS[id] : null
          // The wind grid's base bands (the first grid's first range), asked for now, a second
          // or more before the app could ask, unless the phone keeps a copy; the app takes the
          // response over (spots/habitatGrid.ts). The habitat grid follows them in the app, so
          // they have the line to themselves. No-store: the browser's cache cannot serve a range
          // of a file it holds gzip-encoded
          try {
            var g = area && area.grids && area.grids[0]
            var kept = null
            try { if (g) kept = localStorage.getItem('chartfile:' + g.file) } catch (e) {}
            if (g && !kept && window.fetch && navigator.onLine !== false) {
              var p = fetch(S.data + (area.base || '') + g.file, { cache: 'no-store', headers: { Range: 'bytes=0-' + (g.first - 1) }, priority: 'high' })
              p.catch(function () {})
              window.__gwPre = {}
              window.__gwPre[g.file] = { p: p, first: g.first }
            }
          } catch (e) {}
          // Pickle Lake's manifest and words are the page's own
          if (!area || !area.manifest) return
          // for the splash's place line, further down
          window.huntappArea = area.name
          if (!('standalone' in navigator)) return
          var link = document.createElement('link')
          link.rel = 'manifest'
          link.href = area.manifest
          document.head.appendChild(link)
          document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', area.name)
          document.title = area.name + ' · Groundwind'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="word"><b>Groundwind</b><span>Wind and scent at head height</span></div>
    </div>
    <script>
      // the line under the name says what the app is: another area's name when the page opens on one (the head's pick)
      try {
        if (window.huntappArea) document.querySelector('#splash .word span').textContent = window.huntappArea
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
