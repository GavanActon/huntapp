<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pic River" />
    <meta name="theme-color" content="#0f1a12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://geo.weather.gc.ca" crossorigin />
    <title>Pic River — hunt & fish maps</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1a12; }
      #splash { position: fixed; inset: 0; background: #0f1a12; color: #eef5ea; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.35s ease; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .word { text-align: center; }
      #splash .word b { display: block; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
      #splash .word span { display: block; margin-top: 4px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6f8a6a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="word"><b>Pic River</b><span>White Lake · Manitouwadge</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
